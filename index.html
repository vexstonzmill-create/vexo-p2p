<!DOCTYPE html>
<html>
<head>
<title>VEXO TEST</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
button{background:#FFD60A;color:#000;padding:15px 30px;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin:10px;display:block;width:100%;max-width:300px}
</style>
</head>
<body>
<h1>VEXO TEST</h1>
<p>Если видишь эту страницу — HTML работает.</p>

<button onclick="alert('INLINE JS РАБОТАЕТ!')">Тест 1: Inline JS</button>

<button id="test2">Тест 2: DOM ready</button>

<button id="test3">Тест 3: app.js загрузился?</button>

<script>
document.getElementById('test2').onclick = function(){
  alert('DOM READY РАБОТАЕТ!');
};

document.getElementById('test3').onclick = function(){
  if (typeof API !== 'undefined') {
    alert('APP.JS ЗАГРУЖЕН!');
  } else {
    alert('APP.JS НЕ ЗАГРУЖЕН!');
  }
};

console.log('INLINE SCRIPT WORKS');
</script>

<script src="app.js"></script>
</body>
</html>
